[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logitdiff-widget"
version = "0.1.0"
description = "Standalone notebook utilities for LogitDiff prompt and generation heatmaps."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "transformers",
  "numpy",
  "plotly",
  "kaleido",
  "pillow",
  "matplotlib",
  "ipywidgets",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["logitdiff_widget*"]
